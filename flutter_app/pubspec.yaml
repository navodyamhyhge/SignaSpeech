name: signa_fix
description: SignaSpeech - Real-Time Sign Language Detection App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.2.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.5.0
  google_fonts: ^6.2.1
  flutter_tts: ^4.2.5
  camera: ^0.12.0+1
  tflite_flutter: ^0.12.1
  image: ^4.8.0
  permission_handler: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/model/